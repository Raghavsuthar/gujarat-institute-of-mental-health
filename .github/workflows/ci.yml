name: CI & Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Validate, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Validate Trilingual Content Integrity
        run: npm run validate

      - name: Check TypeScript Types & Linting
        run: npm run lint

      - name: Run API Safety Tests
        run: npm test

      - name: Build Production Bundle & Server
        run: npm run build
